name: Build KitchenAI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        shell: pwsh
        run: |
          Write-Host "KitchenAI build started"
          Get-ChildItem -Recurse | Select-Object FullName

      - name: Create test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          "KitchenAI Package 01" | Out-File dist\KitchenAI_Package_01.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchenAI-Package-01
          path: dist
